# Self-contained: no `workspace = true`, no `[workspace]` table. When this repository is a
# submodule inside another cargo workspace, the crate becomes a member of it (cargo puts a path
# dependency of a member that lives inside the workspace directory in it automatically), and it
# still builds on its own from this repository, where nothing above it is a workspace root.
[package]
name = "spix_gpui"
description = "The Spix XML-RPC test server, for a GPUI app written in Rust"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
async-channel = "2.5.0"
# Pinned exactly: GPUI comes as a snapshot through this crate, and its `test-support` feature
# is what fills the registry of elements the server looks paths up in.
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
raw-window-handle = "0.6.2"
spix_server = { path = "../spix_server" }
x11rb = "0.13.2"

[dev-dependencies]
png = "0.18.1"
roxmltree = "0.21.1"

# Spelled out rather than inherited from a workspace, so that the crate also builds from this
# repository alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
