# Self-contained: no `workspace = true`, no `[workspace]` table. When this repository is a
# submodule inside another cargo workspace, the crate becomes a member of it (cargo puts a path
# dependency of a member that lives inside the workspace directory in it automatically), and it
# still builds on its own from this repository, where nothing above it is a workspace root.
[package]
name = "spix_slint"
description = "The Spix XML-RPC test server, for a Slint app written in Rust"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
# Pinned exactly: the testing crate is internal to Slint and its version must match slint's.
# `renderer-software` gives the testing backend a real rasterizer to take screenshots from.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
png = "0.18.1"
roxmltree = "0.21.1"
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "std"] }
thiserror = "2.0.21"

# The tests drive a window of their own, so they need slint and the testing backend directly:
# integration tests see the dependencies of the test, not of the library.
[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
roxmltree = "0.21.1"
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "std"] }

# Spelled out rather than inherited from a workspace, so that the crate also builds from this
# repository alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
